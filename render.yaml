services:
  - type: web
    name: resort-games
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resort-games-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: HOST_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: resort-games-db
    plan: basic-256mb
    region: oregon
